[package]
name = "arxfund"
version = "0.1.0"
edition = "2024"
description = "ARXFUND — lecteur musical et studio de production natif"
authors = ["ARXFUND"]
default-run = "ARXFUND"

[[bin]]
name = "ARXFUND"
path = "src/main.rs"

[lib]
name = "arxfund"
path = "src/lib.rs"

[dependencies]
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
eframe = "0.37.0"
hound = "3.5.1"
image = "0.25.10"
lofty = "0.25.5"
parking_lot = "0.13.0"
rfd = "0.18.0"
rubato = "5.0.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
symphonia = { version = "0.6.1", features = ["mp3", "flac", "wav", "ogg", "vorbis", "aac", "isomp4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
